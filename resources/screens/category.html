<!-- Category Section -->
<section id="category" class="content-section">
    <header class="section-header">
        <div class="header-main">
            <h1>Categorias</h1>
        </div>
        <button class="btn-primary" id="openCategoryModal">
            <i class="ph ph-plus"></i> Nova Categoria
        </button>
    </header>
    <div class="table-container glass">
        <table id="categoryTable">
            <thead>
                <tr>
                    <th>Categoria</th>
                    <th>Subcategorias</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="categoryModal" class="modal">
        <div class="modal-content glass">
            <h2>Nova Categoria</h2>
            <form id="categoryForm">
                <div class="form-group">
                    <label>Categoria</label>
                    <select id="categoryName" required>
                        <option value="">--- Selecione ---</option>
                        <option value="income">Receitas</option>
                        <option value="essentials">Despesas Necessárias</option>
                        <option value="lifestyle">Despesas Eventuais</option>
                        <option value="investments">Investimentos</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Subcategorias</label>
                    <input
                        type="text"
                        id="categorySubcategories"
                        placeholder="Supermercado"
                    />
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary close-modal">
                        Cancelar
                    </button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</section>
