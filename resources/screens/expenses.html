<!-- Expenses Section -->
<section id="expenses" class="content-section">
    <header class="section-header">
        <div class="header-main">
            <h1>Despesas</h1>
            <span class="section-total">Soma: <b id="sectionTotalExpense">R$ 0,00</b></span>
        </div>
        <button class="btn-primary" id="openExpenseModal"><i class="ph ph-plus"></i> Nova Despesa</button>
    </header>
    <div class="table-container glass">
        <table id="expenseTable">
            <thead>
                <tr>
                    <th>Membro</th>
                    <th>Tipo/Local</th>
                    <th>Categoria</th>
                    <th>Valor</th>
                    <th>Data</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</section>
