<!-- Investments Section -->
<section id="investments" class="content-section">
    <header class="section-header">
        <div class="header-main">
            <h1>Investimentos</h1>
            <span class="section-total">Soma: <b id="sectionTotalInvestment">R$ 0,00</b></span>
        </div>
        <button class="btn-primary" id="openInvestmentModal"><i class="ph ph-plus"></i> Novo
            Investimento</button>
    </header>
    <div class="table-container glass">
        <table id="investmentTable">
            <thead>
                <tr>
                    <th>Membro</th>
                    <th>Título/Tipo</th>
                    <th>Valor</th>
                    <th>Data</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="investmentModal" class="modal">
        <div class="modal-content glass">
            <h2>Novo Investimento</h2>
            <form id="investmentForm">
                <div class="form-group">
                    <label>Valor</label>
                    <input type="number" id="investmentValue" step="0.01" required placeholder="0,00">
                </div>
                <div class="form-group">
                    <label>Título/Tipo</label>
                    <input type="text" id="investmentType" required placeholder="Ex: Tesouro Direto, CDB">
                </div>
                <div class="form-group">
                    <label>Membro Familiar</label>
                    <input type="text" id="investmentMember" required placeholder="Ex: João">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary close-modal">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</section>
