<!-- Incomes Section -->
<section id="incomes" class="content-section">
    <header class="section-header">
        <div class="header-main">
            <h1>Receitas</h1>
            <span class="section-total">Soma: <b id="sectionTotalIncome">R$ 0,00</b></span>
        </div>
        <button class="btn-primary" id="openIncomeModal"><i class="ph ph-plus"></i> Nova Receita</button>
    </header>
    <div class="table-container glass">
        <table id="incomeTable">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Tipo</th>
                    <th>Valor</th>
                    <th>Data</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</section>
