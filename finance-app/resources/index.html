<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceFamily - Gestão Financeira</title>
    <link rel="icon" type="image/png" href="icons/appIcon.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="dark-mode">
    <!-- Splash Screen -->
    <div id="splash-screen" class="splash-screen">
        <div class="splash-content">
            <img src="icons/splash-icon.png" alt="FinanceFamily Logo" class="splash-logo">
            <div class="splash-loader"></div>
            <h1>FinanceFamily</h1>
        </div>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="ph ph-wallet"></i>
                <span>FinanceFamily</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-section="dashboard">
                    <i class="ph ph-squares-four"></i> Dashboard
                </a>
                <a href="#" class="nav-item" data-section="cashbook">
                    <i class="ph ph-book-open"></i> Livro Caixa
                </a>
                <a href="#" class="nav-item" data-section="periods">
                    <i class="ph ph-calendar"></i> Períodos
                </a>
                <a href="#" class="nav-item" data-section="accounts">
                    <i class="ph ph-bank"></i> Contas
                </a>
                <a href="#" class="nav-item" data-section="investments">
                    <i class="ph ph-piggy-bank"></i> Investimentos
                </a>
                <a href="#" class="nav-item" data-section="category">
                    <i class="ph ph-tag"></i> Categorias
                </a>
                <a href="#" class="nav-item" data-section="about">
                    <i class="ph ph-info"></i> Sobre
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="theme-toggle" id="themeToggle" title="Alternar tema">
                    <i class="ph ph-moon"></i>
                </button>
                <div class="user-info">
                    <i class="ph ph-user-circle"></i>
                    <span>Família</span>
                </div>
            </div>
        </aside> 
        <!-- Main Content Shell -->
        <main class="main-content" id="main-container">
            <!-- Screens will be injected here -->
            <div class="loading-state">
                <div class="splash-loader"></div>
                <p>Carregando seções...</p>
            </div>
        </main>
        <!-- </main> -->
    </div>

    <!-- Modals -->
    <div id="incomeModal" class="modal">
        <div class="modal-content glass">
            <h2>Nova Receita</h2>
            <form id="incomeForm">
                <div class="form-group">
                    <label>Valor</label>
                    <input type="number" id="incomeValue" step="0.01" required placeholder="0,00">
                </div>
                <div class="form-group">
                    <label>Tipo de Receita</label>
                    <input type="text" id="incomeType" required placeholder="Ex: Salário, Freelance">
                </div>
                <div class="form-group">
                    <label>Nome do Familiar</label>
                    <input type="text" id="incomeMember" required placeholder="Ex: João">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary close-modal">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="expenseModal" class="modal">
        <div class="modal-content glass">
            <h2>Nova Despesa</h2>
            <form id="expenseForm">
                <div class="form-group">
                    <label>Valor</label>
                    <input type="number" id="expenseValue" step="0.01" required placeholder="0,00">
                </div>
                <div class="form-group">
                    <label>Tipo de Despesa</label>
                    <input type="text" id="expenseType" required placeholder="Ex: Aluguel, Mercado">
                </div>
                <div class="form-group">
                    <label>Local</label>
                    <input type="text" id="expenseLocation" required placeholder="Ex: Carrefour">
                </div>
                <div class="form-group">
                    <label>Membro Familiar</label>
                    <input type="text" id="expenseMember" required placeholder="Ex: Maria">
                </div>
                <div class="form-group">
                    <label>Categoria</label>
                    <select id="expenseCategory" required>
                        <option value="essentials">Essenciais</option>
                        <option value="lifestyle">Estilo de Vida</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary close-modal">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    

    <div id="categoryModal" class="modal">
        <div class="modal-content glass">
            <h2>Nova Categoria</h2>
            <form id="categoryForm">
                <div class="form-group">
                    <label>Categoria</label>
                    <input type="text" id="categoryName" required placeholder="Ex: Alimentação">
                </div>
                <div class="form-group">
                    <label>Subcategorias</label>
                    <input type="text" id="categorySubcategories" placeholder="Ex: Supermercado, Restaurantes">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary close-modal">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/neutralino.js"></script>
    <script src="js/sql-wasm.js"></script>
    <script src="js/chart.min.js"></script>
    <script src="js/core.js"></script>
    <script src="js/theme-manager.js"></script>
    <script src="js/screen-loader.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/entries.js"></script>
    <script src="js/investments.js"></script>
    <script src="js/categories.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/accounts.js"></script>
    <script src="js/periods.js"></script>
    <script src="js/cashbook.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
