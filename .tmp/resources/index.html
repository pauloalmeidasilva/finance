<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FinanceFamily - Gestão Financeira</title>
        <link rel="icon" type="image/png" href="icons/appIcon.png" />
        <link rel="stylesheet" href="css/styles.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <script src="https://unpkg.com/@phosphor-icons/web"></script>
    </head>

    <body class="light-mode">
        <!-- Splash Screen -->
        <div id="splash-screen" class="splash-screen">
            <div class="splash-content">
                <img
                    src="icons/splash-icon.png"
                    alt="FinanceFamily Logo"
                    class="splash-logo"
                />
                <div class="splash-loader"></div>
                <h1>FinanceFamily</h1>
            </div>
        </div>

        <div class="app-container">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="logo">
                    <i class="ph ph-wallet"></i>
                    <span>FinanceFamily</span>
                </div>
                <nav class="nav-menu">
                    <a
                        href="#"
                        class="nav-item active"
                        data-section="dashboard"
                    >
                        <i class="ph ph-squares-four"></i> Dashboard
                    </a>
                    <a href="#" class="nav-item" data-section="cashbook">
                        <i class="ph ph-book-open"></i> Livro Caixa
                    </a>
                    <a href="#" class="nav-item" data-section="accounts">
                        <i class="ph ph-bank"></i> Contas
                    </a>
                    <a href="#" class="nav-item" data-section="category">
                        <i class="ph ph-tag"></i> Categorias
                    </a>
                    <a href="#" class="nav-item" data-section="about">
                        <i class="ph ph-info"></i> Sobre
                    </a>
                </nav>
            </aside>
            <!-- Main Content Shell -->
            <main class="main-content" id="main-container">
                <!-- Screens will be injected here -->
                <div class="loading-state">
                    <div class="splash-loader"></div>
                    <p>Carregando seções...</p>
                </div>
            </main>
            <!-- </main> -->
        </div>

        <!-- Modals -->
        <div id="incomeModal" class="modal">
            <div class="modal-content glass">
                <h2>Nova Receita</h2>
                <form id="incomeForm">
                    <div class="form-group">
                        <label>Valor</label>
                        <input
                            type="number"
                            id="incomeValue"
                            step="0.01"
                            required
                            placeholder="0,00"
                        />
                    </div>
                    <div class="form-group">
                        <label>Tipo de Receita</label>
                        <input
                            type="text"
                            id="incomeType"
                            required
                            placeholder="Ex: Salário, Freelance"
                        />
                    </div>
                    <div class="form-group">
                        <label>Nome do Familiar</label>
                        <input
                            type="text"
                            id="incomeMember"
                            required
                            placeholder="Ex: João"
                        />
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn-secondary close-modal">
                            Cancelar
                        </button>
                        <button type="submit" class="btn-primary">
                            Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div id="expenseModal" class="modal">
            <div class="modal-content glass">
                <h2>Nova Despesa</h2>
                <form id="expenseForm">
                    <div class="form-group">
                        <label>Valor</label>
                        <input
                            type="number"
                            id="expenseValue"
                            step="0.01"
                            required
                            placeholder="0,00"
                        />
                    </div>
                    <div class="form-group">
                        <label>Tipo de Despesa</label>
                        <input
                            type="text"
                            id="expenseType"
                            required
                            placeholder="Ex: Aluguel, Mercado"
                        />
                    </div>
                    <div class="form-group">
                        <label>Local</label>
                        <input
                            type="text"
                            id="expenseLocation"
                            required
                            placeholder="Ex: Carrefour"
                        />
                    </div>
                    <div class="form-group">
                        <label>Membro Familiar</label>
                        <input
                            type="text"
                            id="expenseMember"
                            required
                            placeholder="Ex: Maria"
                        />
                    </div>
                    <div class="form-group">
                        <label>Categoria</label>
                        <select id="expenseCategory" required>
                            <option value="essentials">Essenciais</option>
                            <option value="lifestyle">Estilo de Vida</option>
                        </select>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn-secondary close-modal">
                            Cancelar
                        </button>
                        <button type="submit" class="btn-primary">
                            Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Scripts lib -->
        <script src="js/lib/neutralino.js"></script>
        <script src="js/lib/sql-wasm.js"></script>
        <script src="js/lib/chart.min.js"></script>

        <!-- Scripts core -->
        <script src="js/core/core.js"></script>
        <script src="js/core/navigation.js"></script>

        <!-- Scripts ui -->
        <script src="js/ui/screen-loader.js"></script>

        <!-- Scripts modules -->
        <script src="js/modules/entries.js"></script>
        <script src="js/modules/categories.js"></script>
        <script src="js/modules/accounts.js"></script>
        <script src="js/modules/cashbook.js"></script>

        <!-- Scripts ui -->
        <script src="js/ui/dashboard.js"></script>

        <!-- Scripts main -->
        <script src="js/core/main.js"></script>
    </body>
</html>
