<!-- Seção do Livro Caixa -->
<section id="cashbook" class="content-section">
    <div class="print-only-header">
        <strong>Relatório do Livro Caixa</strong> — Emitido em:
        <span id="printIssueDate"></span>
    </div>
    <header class="section-header">
        <div class="header-main">
            <h1>Livro Caixa</h1>

            <!-- Barra de Filtros Avançados -->
            <div class="cashbook-filters">
                <select id="cashbookAccountFilter" class="filter-select">
                    <option value="all">Todas as Contas</option>
                </select>

                <select id="cashbookCategoryFilter" class="filter-select">
                    <option value="all">Todas as Categorias</option>
                </select>

                <select id="cashbookSubcategoryFilter" class="filter-select">
                    <option value="all">Todas as Subcategorias</option>
                </select>

                <div
                    class="date-filter-group"
                    style="display: flex; gap: 0.5rem; align-items: center"
                >
                    <input
                        type="date"
                        id="cashbookStartDate"
                        class="filter-select"
                        title="Data Inicial"
                    />
                    <span style="color: var(--text-secondary)">até</span>
                    <input
                        type="date"
                        id="cashbookEndDate"
                        class="filter-select"
                        title="Data Final"
                    />
                </div>

                <button
                    type="button"
                    class="btn-secondary btn-sm"
                    id="clearCashbookFiltersBtn"
                    title="Limpar Filtros"
                >
                    <i class="ph ph-x-circle"></i> Limpar
                </button>
            </div>
        </div>

        <div class="header-actions">
            <button class="btn-secondary" id="printCashbookBtn">
                <i class="ph ph-printer"></i> Imprimir
            </button>
            <button class="btn-secondary" id="openTransferModal">
                <i class="ph ph-arrows-left-right"></i> Transferência
            </button>
            <button class="btn-primary" id="openCashbookModal">
                <i class="ph ph-plus"></i> Novo Lançamento
            </button>
        </div>
    </header>

    <!-- Tabela de Lançamentos -->
    <div class="table-container glass">
        <table id="cashbookTable">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Conta</th>
                    <th>Tipo</th>
                    <th>Categoria / Subcategoria</th>
                    <th>Descrição</th>
                    <th>Entrada</th>
                    <th>Saída</th>
                    <th>Saldo</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Cards de Totais -->
    <div class="cashbook-calc-card glass">
        <div class="calc-row income">
            <span class="calc-label"
                ><i class="ph ph-plus-circle"></i> Receitas (Entradas)</span
            >
            <span id="cashbookTotalIncome" class="calc-value income-val"
                >R$ 0,00</span
            >
        </div>
        <div class="calc-row expense">
            <span class="calc-label"
                ><i class="ph ph-minus-circle"></i> Despesas (Saídas)</span
            >
            <span id="cashbookTotalExpense" class="calc-value expense-val"
                >R$ 0,00</span
            >
        </div>
        <div class="calc-divider"></div>
        <div class="calc-row balance">
            <span class="calc-label"
                ><i class="ph ph-equals"></i> Saldo do Período</span
            >
            <span id="cashbookBalance" class="calc-value balance-val"
                >R$ 0,00</span
            >
        </div>
    </div>
</section>

<!-- MODAL 1: LANÇAMENTOS (ENTRADA / SAÍDA) -->
<div id="cashbookModal" class="modal">
    <div class="modal-content glass">
        <div class="modal-title-bar">
            <h2 id="cashbookModalTitle">Novo Lançamento</h2>
            <button class="icon-btn close-cashbook-modal" type="button">
                <i class="ph ph-x"></i>
            </button>
        </div>

        <form id="cashbookForm">
            <div class="form-group">
                <label for="cashbookOperationType">Tipo de Movimento</label>
                <select id="cashbookOperationType" required>
                    <option value="income">Entrada (Receita)</option>
                    <option value="expense">Saída (Despesa)</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="cashbookAccount">Conta</label>
                    <select id="cashbookAccount" required>
                        <option value="">Selecione...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cashbookCategory">Categoria</label>
                    <select id="cashbookCategory" required>
                        <option value="">Selecione...</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="cashbookSubcategory">Subcategoria</label>
                <select id="cashbookSubcategory">
                    <option value="">Selecione a categoria primeiro...</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="cashbookDate">Data</label>
                    <input type="date" id="cashbookDate" required />
                </div>
                <div class="form-group">
                    <label for="cashbookValue">Valor (R$)</label>
                    <input
                        type="number"
                        id="cashbookValue"
                        step="0.01"
                        min="0.01"
                        required
                        placeholder="0,00"
                    />
                </div>
            </div>

            <div class="form-group">
                <label for="cashbookDescription">Descrição</label>
                <input
                    type="text"
                    id="cashbookDescription"
                    placeholder="Ex: Pagamento de Conta, Salário..."
                    required
                />
            </div>

            <div class="form-group">
                <label for="cashbookNotes">Anotações Pertinentes</label>
                <textarea
                    id="cashbookNotes"
                    rows="2"
                    placeholder="Observações adicionais (opcional)"
                ></textarea>
            </div>

            <div class="modal-actions">
                <button
                    type="button"
                    class="btn-secondary close-cashbook-modal"
                >
                    Cancelar
                </button>
                <button type="submit" class="btn-primary">
                    <i class="ph ph-floppy-disk"></i> Salvar
                </button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL 2: EXCLUSIVO PARA TRANSFERÊNCIAS -->
<div id="transferModal" class="modal">
    <div class="modal-content glass">
        <div class="modal-title-bar">
            <h2>Transferência entre Contas</h2>
            <button class="icon-btn close-transfer-modal" type="button">
                <i class="ph ph-x"></i>
            </button>
        </div>

        <form id="cashbookTransferForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="cashbookSourceAccount"
                        >Conta Origem (Sai)</label
                    >
                    <select id="cashbookSourceAccount" required>
                        <option value="">Selecione...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cashbookTargetAccount"
                        >Conta Destino (Entra)</label
                    >
                    <select id="cashbookTargetAccount" required>
                        <option value="">Selecione...</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="transferDate">Data</label>
                    <input type="date" id="transferDate" required />
                </div>
                <div class="form-group">
                    <label for="transferValue">Valor (R$)</label>
                    <input
                        type="number"
                        id="transferValue"
                        step="0.01"
                        min="0.01"
                        required
                        placeholder="0,00"
                    />
                </div>
            </div>

            <div class="form-group">
                <label for="transferDescription">Descrição</label>
                <input
                    type="text"
                    id="transferDescription"
                    placeholder="Ex: Transferência PIX, Aplicação..."
                    required
                />
            </div>

            <div class="form-group">
                <label for="transferNotes">Anotações Pertinentes</label>
                <textarea
                    id="transferNotes"
                    rows="2"
                    placeholder="Observações adicionais (opcional)"
                ></textarea>
            </div>

            <div class="modal-actions">
                <button
                    type="button"
                    class="btn-secondary close-transfer-modal"
                >
                    Cancelar
                </button>
                <button type="submit" class="btn-primary">
                    <i class="ph ph-arrows-left-right"></i> Transferir
                </button>
            </div>
        </form>
    </div>
</div>
